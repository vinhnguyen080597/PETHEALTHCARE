<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test case score systems - web</title>
    <link rel="stylesheet" href="./score-systems-ui.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>Test case score systems - Web</h1>
        <p>
          Checklist thu cong cho <code>pet-health-web</code>. Tick Pass khi case dat;
          trang thai luu trong <code>localStorage</code>.
        </p>
        <div class="stats" id="stats"></div>
        <div class="actions">
          <button type="button" id="mark-all" class="btn btn-secondary">Danh dau tat ca pass</button>
          <button type="button" id="clear-all" class="btn btn-ghost">Xoa het tick</button>
          <span class="hint">Mo file nay bang browser hoac Live Server.</span>
        </div>
      </header>

      <section class="callout callout-ok">
        <strong>Pham vi:</strong> diem minh bach, diem danh gia, diem tuan thu, tach biet 3 he thong diem,
        va gauge animation tren giao dien web.
      </section>

      <div id="sections"></div>
    </main>
    <script src="./score-systems-ui.js"></script>
  </body>
</html>
